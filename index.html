<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NickFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #e85d2f;
      --orange-dark: #c94b22;
      --green: #2ecc71;
      --bg: #0f0f0f;
      --bg2: #161616;
      --bg3: #1a1a1a;
      --border: #1e1e1e;
      --border2: #2a2a2a;
      --text: #f0ede8;
      --text-dim: #888;
      --text-muted: #555;
    }

    html, body {
      background: var(--bg);
      font-family: 'Barlow', sans-serif;
      color: var(--text);
      height: 100%;
      overflow: hidden;
    }

    #app {
      max-width: 430px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    /* ---- AUTH SCREEN ---- */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 40px 24px;
      gap: 20px;
      text-align: center;
    }

    .auth-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 80px;
      font-weight: 800;
      color: var(--orange);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .auth-tagline {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 260px;
      line-height: 1.6;
    }

    .auth-btn {
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px 32px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .auth-btn:active { transform: scale(0.96); background: var(--orange-dark); }

    .error-msg {
      font-size: 13px;
      color: var(--orange);
      padding: 10px 16px;
      background: rgba(232,93,47,0.1);
      border-radius: 10px;
      max-width: 300px;
      line-height: 1.5;
    }

    /* ---- MAIN APP ---- */
    #main-screen { display: flex; flex-direction: column; height: 100%; }
    #main-screen.hidden { display: none; }
    #auth-screen.hidden { display: none; }

    /* Header */
    .header {
      padding: 48px 20px 0;
      background: var(--bg);
      flex-shrink: 0;
    }

    .header-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .app-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--orange);
    }

    .date-label {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    /* Back button */
    .back-btn {
      background: none;
      border: none;
      color: var(--orange);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn.hidden, .app-name.hidden { display: none; }

    /* Progress bar (home) */
    .progress-wrap { margin-top: 12px; }
    .progress-text {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .progress-bar { height: 4px; background: var(--border2); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--orange); border-radius: 4px; transition: width 0.3s; }

    /* Routine list (home) */
    .routine-list { padding: 8px 0 24px; }
    .routine-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 18px 20px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      text-align: left;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.2s, background 0.15s;
    }
    .routine-card:active { background: var(--bg2); }
    .routine-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--orange);
      width: 22px;
      flex-shrink: 0;
    }
    .routine-info { flex: 1; min-width: 0; }
    .routine-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .routine-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .routine-status {
      flex-shrink: 0;
      font-size: 20px;
      color: var(--text-muted);
    }
    .routine-card.done { opacity: 0.35; }
    .routine-card.done .routine-num { color: var(--text-muted); }
    .routine-card.done .routine-status { color: var(--green); font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

    .reset-btn {
      display: block;
      margin: 24px auto 0;
      background: none;
      border: 1px solid var(--border2);
      color: var(--text-dim);
      border-radius: 100px;
      padding: 9px 20px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .reset-btn:active { background: var(--bg2); }

    /* Complete routine button */
    .complete-wrap { padding: 24px 20px 8px; }
    .complete-btn {
      width: 100%;
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .complete-btn:active { transform: scale(0.98); background: var(--orange-dark); }
    .complete-btn.done { background: var(--bg3); color: var(--green); border: 1.5px solid var(--border2); }
    .complete-btn:disabled { opacity: 0.6; }
    .complete-hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 8px; }

    /* Day heading */
    .day-heading {
      padding: 14px 20px 0;
    }

    .day-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }

    .day-subtitle {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 14px 0 0;
    }

    /* Exercises list */
    .exercises {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 24px;
    }

    .section-label {
      padding: 14px 20px 4px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--orange);
    }

    .note-row {
      padding: 4px 20px 0;
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }

    .exercise-row {
      display: flex;
      align-items: center;
      padding: 13px 20px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .ex-info { flex: 1; min-width: 0; }

    .ex-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.35;
    }

    .ex-prev {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .ex-prev b { color: var(--text-dim); font-weight: 600; }

    .ex-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .ex-input {
      width: 76px;
      background: var(--bg3);
      border: 1.5px solid var(--border2);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 15px;
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }

    .ex-input:focus { border-color: var(--orange); background: var(--bg2); }
    .ex-input.saved { border-color: var(--green); color: var(--green); }

    /* Yes/No toggle */
    .yn-wrap {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .yn-btn {
      width: 48px;
      height: 36px;
      border-radius: 10px;
      border: 1.5px solid var(--border2);
      background: var(--bg3);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .yn-btn.selected-yes {
      background: var(--green);
      border-color: var(--green);
      color: #062918;
    }

    .yn-btn.selected-no {
      background: #444;
      border-color: #444;
      color: var(--text);
    }

    .yn-btn.saved {
      opacity: 0.7;
    }

    .save-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--orange);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      color: white;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      line-height: 1;
    }

    .save-btn:active { transform: scale(0.92); background: var(--orange-dark); }
    .save-btn.saved { background: var(--green); }
    .save-btn:disabled { opacity: 0.5; }

    /* Rest day */
    .rest-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 14px;
      padding: 40px 20px;
    }

    .rest-icon { font-size: 56px; line-height: 1; }

    .rest-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      color: #2a2a2a;
    }

    .rest-sub { font-size: 14px; color: #383838; text-align: center; }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      flex-direction: column;
      gap: 16px;
    }

    .spinner {
      width: 30px; height: 30px;
      border: 2px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-label { font-size: 12px; color: var(--text-muted); letter-spacing: 0.06em; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--green);
      color: #062918;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 100px;
      letter-spacing: 0.05em;
      z-index: 999;
      pointer-events: none;
      animation: toastPop 0.2s ease;
      white-space: nowrap;
    }

    .toast.error { background: var(--orange); color: white; }

    @keyframes toastPop {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>

<div id="app">

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="auth-logo">NF</div>
    <p class="auth-tagline" id="auth-tagline">Sign in with Google to load your workout and log your weights.</p>
    <button class="auth-btn" id="sign-in-btn">Connect Google</button>
    <div class="error-msg hidden" id="auth-error"></div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="main-screen" class="hidden">
    <div class="header">
      <div class="header-meta">
        <span class="app-name" id="app-name">NickFit</span>
        <button class="back-btn hidden" id="back-btn">‹ Routines</button>
        <span class="date-label" id="date-label"></span>
      </div>
      <div class="day-heading">
        <div class="day-title" id="day-title">—</div>
        <div class="day-subtitle" id="day-subtitle"></div>
        <div class="progress-wrap" id="home-progress" style="display:none">
          <div class="progress-text" id="progress-text"></div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        </div>
      </div>
      <div class="divider"></div>
    </div>

    <div id="content" class="exercises"></div>
  </div>

</div>

<!-- Toast container (outside app for z-index) -->
<div id="toast-el" style="display:none"></div>

<script>
// =====================================================================
// CONFIG
// =====================================================================
const CLIENT_ID = '671405090900-ma0trn3hgd13qgc4hefhmirs8ep53qk5.apps.googleusercontent.com';
const SPREADSHEET_ID = '1vPNfR9zXAG4XKeW_j6H9q9OKZacUFIBvwYCBIXB1a3I';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';
const API = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}`;

// Hidden tab that stores which routines are done in the current cycle.
// Every other visible tab in the spreadsheet is treated as a routine, in tab order.
const PROGRESS_TAB = 'Progress';

// =====================================================================
// STATE
// =====================================================================
let accessToken = null;
let routines = [];        // [{ sheetId, tab, heading, lastDone }]
let completed = [];       // [{ sheetId, tab, date }] for the current cycle
let currentRoutine = null;
let homeLoadedOnce = false;
let sheetCache = {};      // tab -> raw rows
let parsedCache = {};     // tab -> parsed data
let inputs = {};
let saved = {};

// =====================================================================
// GOOGLE AUTH
// The access token lasts ~1 hour. It's kept in this browser's storage so
// reopening the app (e.g. from the home-screen icon) doesn't need a new
// sign-in. When it expires, the app shows a Reconnect button: mobile
// browsers only allow Google's sign-in window to open from a tap.
// =====================================================================
const TOKEN_KEY = 'nickfit_token';
let tokenClient = null;
let tokenExpiresAt = 0;

function initAuth() {
  if (!window.google?.accounts?.oauth2) {
    setTimeout(initAuth, 300);
    return;
  }
  tokenClient = window.google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: onAuthResponse,
    error_callback: onAuthError,
  });
}

function storeToken(token, expiresInSec) {
  accessToken = token;
  tokenExpiresAt = Date.now() + (Number(expiresInSec) || 3600) * 1000;
  try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ t: token, e: tokenExpiresAt })); } catch {}
}

function clearToken() {
  accessToken = null;
  tokenExpiresAt = 0;
  try { localStorage.removeItem(TOKEN_KEY); } catch {}
}

function loadStoredToken() {
  try {
    const s = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null');
    if (s && s.t && s.e - 2 * 60 * 1000 > Date.now()) {
      accessToken = s.t;
      tokenExpiresAt = s.e;
      return true;
    }
  } catch {}
  return false;
}

function tokenValid() {
  return !!accessToken && tokenExpiresAt - 60 * 1000 > Date.now();
}

function showAuthScreen(message) {
  document.getElementById('main-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
  const btn = document.getElementById('sign-in-btn');
  btn.disabled = false;
  btn.textContent = message ? 'Reconnect Google' : 'Connect Google';
  document.getElementById('auth-tagline').textContent = message ||
    'Sign in with Google to load your workout and log your weights.';
}

function showMainScreen() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.remove('hidden');
  document.getElementById('auth-error').classList.add('hidden');
}

function onAuthResponse(resp) {
  const btn = document.getElementById('sign-in-btn');
  btn.disabled = false;
  if (resp.error) {
    showError(resp.error_description || resp.error);
    return;
  }
  storeToken(resp.access_token, resp.expires_in);
  showMainScreen();
  // Return to the routine that was open, if any
  if (currentRoutine) openRoutine(currentRoutine); else showHome();
}

function onAuthError(err) {
  const btn = document.getElementById('sign-in-btn');
  btn.disabled = false;
  btn.textContent = 'Connect Google';
  const type = err?.type || '';
  if (type === 'popup_failed_to_open') {
    showError('The Google sign-in window was blocked. Allow pop-ups for this site in your browser settings, then tap Connect again.');
  } else if (type === 'popup_closed') {
    showError('The Google sign-in window was closed before finishing. Tap Connect to try again.');
  } else {
    showError('Google sign-in failed' + (type ? ` (${type})` : '') + '. Tap Connect to try again.');
  }
}

// Called when Google rejects the token: send the user to a Reconnect tap
function sessionExpired() {
  clearToken();
  showAuthScreen('Your Google session has expired. Tap below to reconnect — your place is kept.');
  return new Error('Session expired — tap Reconnect');
}

document.getElementById('sign-in-btn').addEventListener('click', () => {
  if (!tokenClient) { showError('Google sign-in is still loading. Wait a moment and try again.'); return; }
  document.getElementById('auth-error').classList.add('hidden');
  const btn = document.getElementById('sign-in-btn');
  btn.disabled = true;
  btn.textContent = 'Connecting…';
  // Re-enable if the window never reports back (e.g. user switches apps)
  setTimeout(() => { if (btn.disabled) { btn.disabled = false; btn.textContent = 'Connect Google'; } }, 20000);
  tokenClient.requestAccessToken({ prompt: '' });
});

// When the app comes back to the foreground, check the token is still good
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (document.getElementById('main-screen').classList.contains('hidden')) return;
  if (!tokenValid()) {
    sessionExpired();
  } else if (!currentRoutine) {
    showHome(); // refresh progress from the sheet
  }
});

// =====================================================================
// SHEETS API HELPERS
// =====================================================================
async function api(path, opts = {}) {
  if (!tokenValid()) throw sessionExpired();
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      Authorization: `Bearer ${accessToken}`,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) throw sessionExpired();
  if (!res.ok) {
    let errMsg = `Sheets request failed (${res.status})`;
    try { const j = await res.json(); errMsg = j.error?.message || errMsg; } catch {}
    throw new Error(errMsg);
  }
  return res.json();
}

// A1 range with the tab name quoted, so names with spaces work ("Bike Zone 2")
function a1(tab, range) {
  return `'${tab.replace(/'/g, "''")}'!${range}`;
}

function colIndexToLetter(idx) {
  let result = '';
  idx++;
  while (idx > 0) {
    const rem = (idx - 1) % 26;
    result = String.fromCharCode(65 + rem) + result;
    idx = Math.floor((idx - 1) / 26);
  }
  return result;
}

async function fetchSheet(tab) {
  if (sheetCache[tab]) return sheetCache[tab];
  const data = await api(`/values/${encodeURIComponent(a1(tab, 'A1:Z60'))}`);
  const rows = data.values || [];
  sheetCache[tab] = rows;
  return rows;
}

async function writeCell(tab, rowIdx, colIdx, value) {
  const range = a1(tab, `${colIndexToLetter(colIdx)}${rowIdx + 1}`);
  return api(`/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`, {
    method: 'PUT',
    body: JSON.stringify({ values: [[value]] }),
  });
}

function todayStr() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
}

// The routine header row is the first row with text in column B.
// Dates of past sessions run along that row from column C.
function findHeaderRow(rows) {
  for (let i = 0; i < rows.length; i++) {
    if ((rows[i]?.[1] || '').trim()) return i;
  }
  return -1;
}

// =====================================================================
// ROUTINES + PROGRESS
// =====================================================================
async function loadRoutinesAndProgress() {
  const meta = await api('?fields=sheets.properties(sheetId,title,index,hidden)');
  const sheets = (meta.sheets || []).map(s => s.properties).sort((a, b) => a.index - b.index);

  // Make sure the hidden Progress tab exists
  if (!sheets.some(s => s.title === PROGRESS_TAB)) {
    await api(':batchUpdate', {
      method: 'POST',
      body: JSON.stringify({ requests: [{ addSheet: { properties: { title: PROGRESS_TAB, hidden: true } } }] }),
    });
    await api(`/values/${encodeURIComponent(a1(PROGRESS_TAB, 'A1:C1'))}?valueInputOption=RAW`, {
      method: 'PUT',
      body: JSON.stringify({ values: [['Routine ID', 'Routine', 'Completed']] }),
    });
  }

  const routineSheets = sheets.filter(s => !s.hidden && s.title !== PROGRESS_TAB);

  // One batch call: progress rows + the top of every routine tab (for heading + last date)
  const ranges = [a1(PROGRESS_TAB, 'A2:C100'), ...routineSheets.map(s => a1(s.title, 'A1:Z6'))];
  const qs = ranges.map(r => 'ranges=' + encodeURIComponent(r)).join('&');
  const batch = await api(`/values:batchGet?${qs}`);
  const vr = batch.valueRanges || [];

  routines = routineSheets.map((s, i) => {
    const rows = vr[i + 1]?.values || [];
    const h = findHeaderRow(rows);
    const headerRow = h >= 0 ? rows[h] : [];
    const dates = headerRow.slice(2).map(v => (v || '').trim()).filter(Boolean);
    return {
      sheetId: s.sheetId,
      tab: s.title,
      heading: h >= 0 ? headerRow[1].trim() : s.title,
      lastDone: dates.length ? dates[dates.length - 1] : '',
    };
  });

  const ids = new Set(routines.map(r => String(r.sheetId)));
  completed = (vr[0]?.values || [])
    .filter(r => r[0] && ids.has(String(r[0])))
    .map(r => ({ sheetId: String(r[0]), tab: r[1] || '', date: r[2] || '' }));

  // Safety net: if every routine is already marked done, start a fresh cycle
  if (routines.length && completed.length >= routines.length) {
    completed = [];
    await writeProgress();
  }
}

async function writeProgress() {
  await api(`/values/${encodeURIComponent(a1(PROGRESS_TAB, 'A2:C100'))}:clear`, { method: 'POST', body: '{}' });
  if (completed.length) {
    await api(`/values/${encodeURIComponent(a1(PROGRESS_TAB, 'A2'))}?valueInputOption=RAW`, {
      method: 'PUT',
      body: JSON.stringify({ values: completed.map(c => [c.sheetId, c.tab, c.date]) }),
    });
  }
}

function isDone(r) {
  return completed.some(c => c.sheetId === String(r.sheetId));
}

// =====================================================================
// HOME SCREEN
// =====================================================================
function setHeaderForHome() {
  document.getElementById('app-name').classList.remove('hidden');
  document.getElementById('back-btn').classList.add('hidden');
  document.getElementById('day-title').textContent = 'Routines';
  document.getElementById('day-subtitle').textContent = '';
  document.getElementById('home-progress').style.display = '';
}

function renderProgress() {
  const total = routines.length;
  const done = routines.filter(isDone).length;
  document.getElementById('progress-text').textContent = total ? `${done} of ${total} complete this cycle` : '';
  document.getElementById('progress-fill').style.width = total ? `${(done / total) * 100}%` : '0%';
}

function renderHome() {
  const content = document.getElementById('content');
  content.innerHTML = '';
  renderProgress();

  if (!routines.length) {
    content.innerHTML = '<div class="loading"><div class="loading-label">No routine tabs found in the sheet</div></div>';
    return;
  }

  const list = document.createElement('div');
  list.className = 'routine-list';

  routines.forEach((r, i) => {
    const done = isDone(r);
    const card = document.createElement('button');
    card.className = 'routine-card' + (done ? ' done' : '');

    const num = document.createElement('div');
    num.className = 'routine-num';
    num.textContent = String(i + 1).padStart(2, '0');

    const info = document.createElement('div');
    info.className = 'routine-info';
    const name = document.createElement('div');
    name.className = 'routine-name';
    name.textContent = r.heading;
    info.appendChild(name);
    if (r.lastDone) {
      const meta = document.createElement('div');
      meta.className = 'routine-meta';
      meta.textContent = `Last done ${r.lastDone}`;
      info.appendChild(meta);
    }

    const status = document.createElement('div');
    status.className = 'routine-status';
    status.textContent = done ? 'Done ✓' : '›';

    card.appendChild(num);
    card.appendChild(info);
    card.appendChild(status);
    card.addEventListener('click', () => openRoutine(r));
    list.appendChild(card);
  });

  const reset = document.createElement('button');
  reset.className = 'reset-btn';
  reset.textContent = 'Reset cycle';
  reset.addEventListener('click', manualReset);
  list.appendChild(reset);

  content.appendChild(list);
}

async function showHome() {
  currentRoutine = null;
  setHeaderForHome();
  const content = document.getElementById('content');

  if (homeLoadedOnce) {
    renderHome(); // show what we have straight away, then refresh from the sheet
  } else {
    content.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-label">Loading routines…</div></div>';
  }

  try {
    await loadRoutinesAndProgress();
    homeLoadedOnce = true;
    if (!currentRoutine) renderHome();
  } catch (e) {
    if (!homeLoadedOnce) {
      content.innerHTML = `<div class="loading"><div class="loading-label" style="color:var(--orange)">${e.message}</div></div>`;
    } else {
      showToast('Error: ' + e.message, true);
    }
  }
}

document.getElementById('back-btn').addEventListener('click', showHome);

async function manualReset() {
  if (!completed.length) { showToast('Nothing to reset'); return; }
  if (!confirm('Reset the cycle? All routines will become available again.')) return;
  try {
    completed = [];
    await writeProgress();
    renderHome();
    showToast('Cycle reset ✓');
  } catch (e) {
    showToast('Error: ' + e.message, true);
  }
}

// =====================================================================
// ROUTINE SCREEN (same as the old day screen)
// =====================================================================
function parseSheet(rows) {
  const headerRowIdx = findHeaderRow(rows);
  if (headerRowIdx < 0) return null;

  const headerRow = rows[headerRowIdx] || [];
  const subtitle = (rows[headerRowIdx + 1]?.[1] || '').trim();

  const exercises = [];
  const startRow = headerRowIdx + 2;

  for (let i = startRow; i < rows.length; i++) {
    const row = rows[i] || [];
    const name = (row[1] || '').trim();
    if (!name) continue;

    // "Last" = most recent value in this row (rightmost non-empty date column)
    let weight = '';
    for (let c = row.length - 1; c >= 2; c--) {
      const v = (row[c] || '').trim();
      if (v) { weight = v; break; }
    }

    const looksLikeExercise = /[–\-×x×\d]/.test(name) || weight !== '';
    const isSectionHeader = !looksLikeExercise;
    const isNote = !isSectionHeader && /^\d+[–\-]/.test(name) && weight === '' && i > startRow;

    exercises.push({ name, weight, rowIndex: i, isSectionHeader, isNote });
  }

  return { title: headerRow[1].trim(), subtitle, exercises, headerRowIdx };
}

async function openRoutine(r) {
  currentRoutine = r;
  inputs = {};
  saved = {};

  document.getElementById('app-name').classList.add('hidden');
  document.getElementById('back-btn').classList.remove('hidden');
  document.getElementById('home-progress').style.display = 'none';

  const titleEl = document.getElementById('day-title');
  const subtitleEl = document.getElementById('day-subtitle');
  const content = document.getElementById('content');

  titleEl.textContent = r.heading;
  subtitleEl.textContent = '';
  content.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-label">Loading workout…</div></div>';

  try {
    let parsed = parsedCache[r.tab];
    if (!parsed) {
      parsed = parseSheet(await fetchSheet(r.tab));
      if (parsed) parsedCache[r.tab] = parsed;
    }
    if (currentRoutine !== r) return; // user went back while loading

    if (!parsed) {
      content.innerHTML = `<div class="loading"><div class="loading-label">No data found for ${r.heading}</div></div>`;
      return;
    }

    titleEl.textContent = parsed.title;
    subtitleEl.textContent = parsed.subtitle;
    renderExercises(parsed, r.tab);
    renderCompleteButton(r);
  } catch (e) {
    content.innerHTML = `<div class="loading"><div class="loading-label" style="color:var(--orange)">${e.message}</div></div>`;
  }
}

function renderExercises(parsed, tab) {
  const content = document.getElementById('content');
  content.innerHTML = '';

  parsed.exercises.forEach((ex) => {
    if (ex.isSectionHeader) {
      const el = document.createElement('div');
      el.className = 'section-label';
      el.textContent = ex.name;
      content.appendChild(el);
      return;
    }

    if (ex.isNote) {
      const el = document.createElement('div');
      el.className = 'note-row';
      el.textContent = ex.name;
      content.appendChild(el);
      return;
    }

    const row = document.createElement('div');
    row.className = 'exercise-row';
    row.dataset.rowIndex = ex.rowIndex;

    const info = document.createElement('div');
    info.className = 'ex-info';

    const nameEl = document.createElement('div');
    nameEl.className = 'ex-name';
    nameEl.textContent = ex.name;
    info.appendChild(nameEl);

    if (ex.weight) {
      const prev = document.createElement('div');
      prev.className = 'ex-prev';
      prev.innerHTML = 'Last: <b></b>';
      prev.querySelector('b').textContent = ex.weight;
      info.appendChild(prev);
    }

    const isYesNo = /^(yes|no)$/i.test((ex.weight || '').trim());

    if (isYesNo) {
      const ynWrap = document.createElement('div');
      ynWrap.className = 'yn-wrap';

      const yesBtn = document.createElement('button');
      yesBtn.className = 'yn-btn';
      yesBtn.textContent = 'Yes';

      const noBtn = document.createElement('button');
      noBtn.className = 'yn-btn';
      noBtn.textContent = 'No';

      const selectYN = async (value, activeBtn, otherBtn) => {
        if (activeBtn.classList.contains('saved')) return;
        inputs[ex.rowIndex] = value;
        activeBtn.classList.add(value === 'yes' ? 'selected-yes' : 'selected-no');
        otherBtn.classList.remove('selected-yes', 'selected-no');
        activeBtn.disabled = true;
        otherBtn.disabled = true;
        try {
          await saveToSheet(tab, ex.rowIndex, value);
          yesBtn.classList.add('saved');
          noBtn.classList.add('saved');
          showToast(`Saved ${value} ✓`);
        } catch (e) {
          activeBtn.disabled = false;
          otherBtn.disabled = false;
          showToast('Error: ' + e.message, true);
        }
      };

      yesBtn.addEventListener('click', () => selectYN('yes', yesBtn, noBtn));
      noBtn.addEventListener('click', () => selectYN('no', noBtn, yesBtn));

      ynWrap.appendChild(yesBtn);
      ynWrap.appendChild(noBtn);
      row.appendChild(info);
      row.appendChild(ynWrap);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'ex-input-wrap';

      const input = document.createElement('input');
      input.className = 'ex-input';
      input.type = 'text';
      input.inputMode = 'text';
      input.placeholder = '—';
      input.setAttribute('autocomplete', 'off');
      input.addEventListener('input', () => { inputs[ex.rowIndex] = input.value; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); doSave(ex, tab, input, btn); }
      });

      const btn = document.createElement('button');
      btn.className = 'save-btn';
      btn.textContent = '↑';
      btn.addEventListener('click', () => doSave(ex, tab, input, btn));

      wrap.appendChild(input);
      wrap.appendChild(btn);
      row.appendChild(info);
      row.appendChild(wrap);
    }

    content.appendChild(row);
  });
}

function renderCompleteButton(r) {
  const content = document.getElementById('content');
  const wrap = document.createElement('div');
  wrap.className = 'complete-wrap';

  const btn = document.createElement('button');
  const hint = document.createElement('div');
  hint.className = 'complete-hint';

  const paint = () => {
    const done = isDone(r);
    btn.className = 'complete-btn' + (done ? ' done' : '');
    btn.textContent = done ? 'Completed ✓' : 'Complete routine';
    hint.textContent = done ? 'Tap to mark as not done' : '';
  };
  paint();

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    const wasDone = isDone(r);
    const before = completed.slice();
    try {
      if (wasDone) {
        completed = completed.filter(c => c.sheetId !== String(r.sheetId));
        await writeProgress();
        paint();
        showToast('Marked as not done');
      } else {
        completed.push({ sheetId: String(r.sheetId), tab: r.tab, date: todayStr() });
        const cycleDone = routines.length && routines.every(isDone);
        if (cycleDone) completed = [];
        await writeProgress();
        showToast(cycleDone ? 'All routines done — cycle reset 🔁' : `${r.heading} complete ✓`);
        setTimeout(showHome, 700);
      }
    } catch (e) {
      completed = before;
      paint();
      showToast('Error: ' + e.message, true);
    } finally {
      btn.disabled = false;
    }
  });

  wrap.appendChild(btn);
  wrap.appendChild(hint);
  content.appendChild(wrap);
}

// =====================================================================
// SAVE — finds/creates today's date column and writes the value
// =====================================================================
async function saveToSheet(tab, exerciseRowIndex, value) {
  const dateStr = todayStr();

  // Always read fresh so we have the real header row
  delete sheetCache[tab];
  delete parsedCache[tab];
  const rows = await fetchSheet(tab);

  const headerRowIdx = findHeaderRow(rows);
  if (headerRowIdx < 0) throw new Error('Could not find header row in sheet');
  const headerRow = rows[headerRowIdx] || [];

  let targetCol = -1;
  for (let c = 2; c < headerRow.length; c++) {
    if ((headerRow[c] || '').trim() === dateStr) { targetCol = c; break; }
  }

  if (targetCol < 0) {
    for (let c = 2; c < 50; c++) {
      if (!(headerRow[c] || '').trim()) { targetCol = c; break; }
    }
    if (targetCol < 0) throw new Error('Could not find empty column for today');
    await writeCell(tab, headerRowIdx, targetCol, dateStr);
  }

  await writeCell(tab, exerciseRowIndex, targetCol, value);
  delete sheetCache[tab];
}

async function doSave(ex, tab, inputEl, btnEl) {
  const value = inputEl.value.trim();
  if (!value) return;
  if (btnEl.disabled) return;

  btnEl.disabled = true;
  btnEl.textContent = '…';

  try {
    await saveToSheet(tab, ex.rowIndex, value);
    inputEl.classList.add('saved');
    btnEl.classList.add('saved');
    btnEl.textContent = '✓';
    showToast(`Saved ${value} ✓`);
  } catch (e) {
    btnEl.disabled = false;
    btnEl.textContent = '↑';
    showToast('Error: ' + e.message, true);
    console.error(e);
  }
}

// =====================================================================
// TOAST / ERRORS
// =====================================================================
let toastTimer = null;

function showToast(msg, isError = false) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  clearTimeout(toastTimer);

  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  document.body.appendChild(el);

  toastTimer = setTimeout(() => el.remove(), 2500);
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.classList.remove('hidden');
}

// =====================================================================
// INIT
// =====================================================================
function updateDateLabel() {
  document.getElementById('date-label').textContent =
    new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

window.addEventListener('load', () => {
  updateDateLabel();
  initAuth();
  if (loadStoredToken()) {
    showMainScreen();
    showHome();
  }
});
</script>
